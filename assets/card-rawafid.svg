<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="100%" height="auto" role="img" aria-label="rawafid">
  <defs>
    <linearGradient id="card-grad-knowledge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#070A11" />
    </linearGradient>
    <linearGradient id="card-border-knowledge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#34D399" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="card-glow-knowledge" cx="0%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes spin-reverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
@keyframes pulse-slow { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.06); } }
@keyframes ping-radar { 0% { r: 4px; opacity: 0.95; stroke-width: 2; } 70% { r: 13px; opacity: 0; stroke-width: 0.5; } 100% { r: 13px; opacity: 0; stroke-width: 0; } }
@keyframes dash-flow { to { stroke-dashoffset: -400; } }
@keyframes laser-beam { 0% { transform: translateX(-220px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(1280px); opacity: 0; } }
@keyframes border-trace { 0% { stroke-dashoffset: 1300; } 100% { stroke-dashoffset: 0; } }
@keyframes float-gentle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes blink-led { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}

    .card-tracer {
      stroke-dasharray: 80 570;
      animation: border-trace 8s linear infinite;
    }
    .pulse-core { animation: pulse-slow 3s ease-in-out infinite; }
    .led-blink { animation: blink-led 1.2s ease-in-out infinite; }
  </style>

  <!-- Card Background -->
  <rect width="440" height="210" rx="12" fill="url(#card-grad-knowledge)" />
  <rect width="440" height="210" rx="12" fill="url(#card-glow-knowledge)" />
  <rect width="440" height="210" rx="12" fill="none" stroke="url(#card-border-knowledge)" stroke-width="1.2" />

  <!-- Animated Neon Border Trail -->
  <rect x="1" y="1" width="438" height="208" rx="11" fill="none" stroke="#34D399" stroke-width="1.8" class="card-tracer" opacity="0.85" />

  <!-- Top bar / icon badge -->
  <g transform="translate(24, 22)">
    <!-- Icon Container with Breathing Glow -->
    <rect width="40" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <g transform="translate(0, 0)">
      
        <g stroke="#34D399" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="20" cy="20" r="14" />
          <path d="M20 6c4 4 6 9 6 14s-2 10-6 14 M20 6c-4 4-6 9-6 14s2 10 6 14 M6 20h28" />
          <circle cx="30" cy="11" r="3" fill="#38BDF8" class="pulse-core" />
          <circle cx="10" cy="29" r="3" fill="#818CF8" class="pulse-core" style="animation-delay: -1s;" />
        </g>
    </g>

    <!-- Category Pill with Live Indicator -->
    <g transform="translate(52, 2)">
      <rect width="234.79999999999998" height="20" rx="4" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="8" cy="10" r="2.5" fill="#34D399" class="pulse-core" />
      <text x="121.39999999999999" y="13.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="600" fill="#34D399" text-anchor="middle" letter-spacing="0.8">KNOWLEDGE &amp; PUBLISHING PLATFORM</text>
    </g>

    <!-- Project Title -->
    <text x="52" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">rawafid</text>
  </g>

  <!-- Description text -->
  <text x="24" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">
    <tspan x="24" dy="0">Multilingual community publishing &amp; distribution network</tspan>
    <tspan x="24" dy="18">designed for high-volume cross-border content and events.</tspan>
  </text>

  <!-- Divider -->
  <line x1="24" y1="144" x2="416" y2="144" stroke="#1E293B" stroke-width="1" />

  <!-- Stack Chips -->
  
        <g transform="translate(24, 162)">
          <rect width="128.5" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="64.25" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">Modular Backend</text>
        </g>
        <g transform="translate(160.5, 162)">
          <rect width="83.5" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="41.75" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">REST APIs</text>
        </g>
        <g transform="translate(252.0, 162)">
          <rect width="53.5" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="26.75" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">MySQL</text>
        </g>
        <g transform="translate(313.5, 162)">
          <rect width="38.5" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="19.25" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">CMS</text>
        </g>

  <!-- External link icon arrow in top right -->
  <g transform="translate(402, 22)" stroke="#34D399" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M0 10 L10 0 M3 0 H10 V7" />
  </g>
</svg>
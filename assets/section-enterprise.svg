<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 68" width="100%" height="auto" role="img" aria-label="ENTERPRISE &amp; DISTRIBUTED SYSTEMS">
  <defs>
    <linearGradient id="sec-line-01" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#512BD4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="beam-grad-01" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes spin-reverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
@keyframes pulse-slow { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.06); } }
@keyframes ping-radar { 0% { r: 4px; opacity: 0.95; stroke-width: 2; } 70% { r: 13px; opacity: 0; stroke-width: 0.5; } 100% { r: 13px; opacity: 0; stroke-width: 0; } }
@keyframes dash-flow { to { stroke-dashoffset: -400; } }
@keyframes laser-beam { 0% { transform: translateX(-220px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(1280px); opacity: 0; } }
@keyframes border-trace { 0% { stroke-dashoffset: 1300; } 100% { stroke-dashoffset: 0; } }
@keyframes float-gentle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes blink-led { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}

    .beam-runner { animation: laser-beam 5s ease-in-out infinite; }
    .number-pulse { animation: pulse-slow 3s ease-in-out infinite; }
  </style>

  <!-- Accent bar with pulse -->
  <rect x="0" y="18" width="4" height="32" rx="2" fill="#38BDF8" />
  
  <!-- Section Number with glow -->
  <text x="18" y="40" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#38BDF8" letter-spacing="1" class="number-pulse">01</text>
  
  <!-- Main Section Title -->
  <text x="58" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F1F5F9" letter-spacing="0.5">ENTERPRISE &amp; DISTRIBUTED SYSTEMS</text>
  
  <!-- Right subtitle / category -->
  <text x="880" y="40" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="end" letter-spacing="1.2">CORE ARCHITECTURE</text>
  
  <!-- Static Bottom divider line -->
  <rect x="0" y="66" width="900" height="1.5" fill="url(#sec-line-01)" />
  
  <!-- Dynamic Traveling Laser Beam -->
  <g clip-path="url(#sec-clip-01)">
    <clipPath id="sec-clip-01"><rect x="0" y="64" width="900" height="4" /></clipPath>
    <rect x="0" y="65" width="160" height="2" fill="url(#beam-grad-01)" class="beam-runner" />
  </g>
</svg>
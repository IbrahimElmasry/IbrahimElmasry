<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="100%" height="auto" role="img" aria-label="DevERP">
  <defs>
    <linearGradient id="card-grad-erp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#070A11" />
    </linearGradient>
    <linearGradient id="card-border-erp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="card-glow-erp" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect width="440" height="210" rx="12" fill="url(#card-grad-erp)" />
  <rect width="440" height="210" rx="12" fill="url(#card-glow-erp)" />
  <rect width="440" height="210" rx="12" fill="none" stroke="url(#card-border-erp)" stroke-width="1.2" />

  <!-- Top bar / icon badge -->
  <g transform="translate(24, 22)">
    <rect width="40" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <g transform="translate(0, 0)">
      
        <g stroke="#38BDF8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="20" cy="11" rx="14" ry="5" />
          <path d="M6 11v8c0 2.76 6.27 5 14 5s14-2.24 14-5v-8" />
          <path d="M6 19v8c0 2.76 6.27 5 14 5s14-2.24 14-5v-8" />
          <circle cx="28" cy="27" r="8" fill="#0B0F19" stroke="#38BDF8" stroke-width="1.5" />
          <path d="M28 23v8 M24 27h8" stroke="#38BDF8" stroke-width="1.5" />
        </g>
    </g>

    <g transform="translate(52, 2)">
      <rect width="190.79999999999998" height="20" rx="4" fill="#0284C7" fill-opacity="0.12" stroke="#0284C7" stroke-opacity="0.35" stroke-width="1" />
      <text x="95.39999999999999" y="13.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="0.8">ENTERPRISE ERP &amp; WORKFLOWS</text>
    </g>

    <text x="52" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">DevERP</text>
  </g>

  <!-- Description text -->
  <text x="24" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">
    <tspan x="24" dy="0">Modular Enterprise Resource Planning system engineered for</tspan>
    <tspan x="24" dy="18">internal operations, inventory, and business process automation.</tspan>
  </text>

  <!-- Divider -->
  <line x1="24" y1="144" x2="416" y2="144" stroke="#1E293B" stroke-width="1" />

  <!-- Stack Chips -->
  
        <g transform="translate(24, 162)">
          <rect width="31.0" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="15.5" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">C#</text>
        </g>
        <g transform="translate(63.0, 162)">
          <rect width="61.0" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="30.5" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">.NET 8</text>
        </g>
        <g transform="translate(132.0, 162)">
          <rect width="151.0" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="75.5" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">Clean Architecture</text>
        </g>
        <g transform="translate(291.0, 162)">
          <rect width="91.0" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="45.5" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">SQL Server</text>
        </g>

  <!-- External link icon arrow in top right -->
  <g transform="translate(402, 22)" stroke="#64748B" stroke-width="1.5" fill="none">
    <path d="M0 10 L10 0 M3 0 H10 V7" />
  </g>
</svg>
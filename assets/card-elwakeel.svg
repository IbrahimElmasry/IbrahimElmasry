<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="100%" height="auto" role="img" aria-label="Elwakeel-LawFirm">
  <defs>
    <linearGradient id="card-grad-law" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#070A11" />
    </linearGradient>
    <linearGradient id="card-border-law" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="card-glow-law" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect width="440" height="210" rx="12" fill="url(#card-grad-law)" />
  <rect width="440" height="210" rx="12" fill="url(#card-glow-law)" />
  <rect width="440" height="210" rx="12" fill="none" stroke="url(#card-border-law)" stroke-width="1.2" />

  <!-- Top bar / icon badge -->
  <g transform="translate(24, 22)">
    <rect width="40" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <g transform="translate(0, 0)">
      
        <g stroke="#818CF8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6v30 M10 36h20 M6 12h28" />
          <path d="M10 12l-5 11h10z" fill="#818CF8" fill-opacity="0.15" />
          <path d="M30 12l-5 11h10z" fill="#818CF8" fill-opacity="0.15" />
          <circle cx="20" cy="6" r="2.5" fill="#818CF8" />
        </g>
    </g>

    <g transform="translate(52, 2)">
      <rect width="184.0" height="20" rx="4" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.35" stroke-width="1" />
      <text x="92.0" y="13.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="600" fill="#818CF8" text-anchor="middle" letter-spacing="0.8">LEGAL PRACTICE MANAGEMENT</text>
    </g>

    <text x="52" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Elwakeel-LawFirm</text>
  </g>

  <!-- Description text -->
  <text x="24" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">
    <tspan x="24" dy="0">Corporate legal practice suite with granular role-based access,</tspan>
    <tspan x="24" dy="18">court session scheduling, and secure document archiving.</tspan>
  </text>

  <!-- Divider -->
  <line x1="24" y1="144" x2="416" y2="144" stroke="#1E293B" stroke-width="1" />

  <!-- Stack Chips -->
  
        <g transform="translate(24, 162)">
          <rect width="106.0" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="53.0" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">ASP.NET Core</text>
        </g>
        <g transform="translate(138.0, 162)">
          <rect width="68.5" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="34.25" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">Web API</text>
        </g>
        <g transform="translate(214.5, 162)">
          <rect width="91.0" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="45.5" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">SQL Server</text>
        </g>
        <g transform="translate(313.5, 162)">
          <rect width="46.0" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="23.0" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">RBAC</text>
        </g>

  <!-- External link icon arrow in top right -->
  <g transform="translate(402, 22)" stroke="#64748B" stroke-width="1.5" fill="none">
    <path d="M0 10 L10 0 M3 0 H10 V7" />
  </g>
</svg>
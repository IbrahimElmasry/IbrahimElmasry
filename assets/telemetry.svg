<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="auto" role="img" aria-label="System Telemetry">
  <defs>
    <linearGradient id="tel-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="tel-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#512BD4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <style>
    
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes spin-reverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
@keyframes pulse-slow { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.06); } }
@keyframes ping-radar { 0% { r: 4px; opacity: 0.95; stroke-width: 2; } 70% { r: 13px; opacity: 0; stroke-width: 0.5; } 100% { r: 13px; opacity: 0; stroke-width: 0; } }
@keyframes dash-flow { to { stroke-dashoffset: -400; } }
@keyframes laser-beam { 0% { transform: translateX(-220px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(1280px); opacity: 0; } }
@keyframes border-trace { 0% { stroke-dashoffset: 1300; } 100% { stroke-dashoffset: 0; } }
@keyframes float-gentle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes blink-led { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}

    .tel-led { animation: blink-led 1.8s ease-in-out infinite; }
    .ping { animation: ping-radar 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
  </style>

  <!-- Background -->
  <rect width="900" height="110" rx="10" fill="url(#tel-bg)" stroke="url(#tel-border)" stroke-width="1.2" />

  <!-- Telemetry Row Items -->
  <g transform="translate(30, 24)">
    <!-- Metric 1: Architecture -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="3" fill="#10B981" />
      <circle cx="6" cy="6" r="3" fill="none" stroke="#10B981" class="ping" />
      <text x="18" y="9" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1">ARCHITECTURAL DISCIPLINE</text>
      <text x="18" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Clean Architecture &amp; DDD</text>
      <text x="18" y="44" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#64748B">Decoupled Domain &amp; CQRS</text>
    </g>

    <!-- Metric 2: Primary Runtime -->
    <g transform="translate(250, 0)">
      <circle cx="6" cy="6" r="3" fill="#38BDF8" class="tel-led" />
      <text x="18" y="9" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1">PRIMARY RUNTIME</text>
      <text x="18" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">.NET 8 / 9 &amp; ASP.NET Core</text>
      <text x="18" y="44" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#64748B">High-Throughput Web APIs</text>
    </g>

    <!-- Metric 3: Modern UI -->
    <g transform="translate(500, 0)">
      <circle cx="6" cy="6" r="3" fill="#A855F7" class="tel-led" style="animation-delay: -0.6s;" />
      <text x="18" y="9" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1">UI &amp; FULL STACK</text>
      <text x="18" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Blazor WebAssembly</text>
      <text x="18" y="44" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#64748B">Component Lifecycle &amp; WASM</text>
    </g>

    <!-- Metric 4: Relational Engine -->
    <g transform="translate(710, 0)">
      <circle cx="6" cy="6" r="3" fill="#10B981" class="tel-led" style="animation-delay: -1.2s;" />
      <text x="18" y="9" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1">DATA PERSISTENCE</text>
      <text x="18" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">SQL Server &amp; EF Core</text>
      <text x="18" y="44" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#64748B">Optimized Indexing &amp; LINQ</text>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="100%" height="auto" role="img" aria-label="IbrahimElmasry.github.io">
  <defs>
    <linearGradient id="card-grad-blazor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#070A11" />
    </linearGradient>
    <linearGradient id="card-border-blazor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#F43F5E" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="card-glow-blazor" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect width="440" height="210" rx="12" fill="url(#card-grad-blazor)" />
  <rect width="440" height="210" rx="12" fill="url(#card-glow-blazor)" />
  <rect width="440" height="210" rx="12" fill="none" stroke="url(#card-border-blazor)" stroke-width="1.2" />

  <!-- Top bar / icon badge -->
  <g transform="translate(24, 22)">
    <rect width="40" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <g transform="translate(0, 0)">
      
        <g stroke="#F43F5E" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="8" width="28" height="24" rx="4" />
          <path d="M6 15h28 M12 12h.01 M16 12h.01" />
          <path d="M14 26l6-8 1 3 5-5" stroke="#38BDF8" stroke-width="2" />
        </g>
    </g>

    <g transform="translate(52, 2)">
      <rect width="204.4" height="20" rx="4" fill="#E11D48" fill-opacity="0.12" stroke="#E11D48" stroke-opacity="0.35" stroke-width="1" />
      <text x="102.2" y="13.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="600" fill="#F43F5E" text-anchor="middle" letter-spacing="0.8">BLAZOR WEBASSEMBLY PORTFOLIO</text>
    </g>

    <text x="52" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">IbrahimElmasry.github.io</text>
  </g>

  <!-- Description text -->
  <text x="24" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94A3B8">
    <tspan x="24" dy="0">Interactive personal portfolio engine built purely in client-side</tspan>
    <tspan x="24" dy="18">Blazor WebAssembly with C# component-driven architecture.</tspan>
  </text>

  <!-- Divider -->
  <line x1="24" y1="144" x2="416" y2="144" stroke="#1E293B" stroke-width="1" />

  <!-- Stack Chips -->
  
        <g transform="translate(24, 162)">
          <rect width="98.5" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="49.25" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">Blazor WASM</text>
        </g>
        <g transform="translate(130.5, 162)">
          <rect width="61.0" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="30.5" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">.NET 8</text>
        </g>
        <g transform="translate(199.5, 162)">
          <rect width="31.0" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="15.5" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">C#</text>
        </g>
        <g transform="translate(238.5, 162)">
          <rect width="106.0" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.9" />
          <text x="53.0" y="15.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">Tailwind CSS</text>
        </g>

  <!-- External link icon arrow in top right -->
  <g transform="translate(402, 22)" stroke="#64748B" stroke-width="1.5" fill="none">
    <path d="M0 10 L10 0 M3 0 H10 V7" />
  </g>
</svg>